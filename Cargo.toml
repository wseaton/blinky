[package]
name = "blinky"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
deku = "0.20.2"
hidapi = "2.6.4"
palette = { version = "0.7.7", features = ["named_from_str"] }
rpassword = "7.5.5"
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
